<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose your program</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>Course Planner</h1>
      <p>RMIT University Vietnam, Saigon South</p>
    </div>
  </header>

  <main class="wide">
    <h2 class="choose-title">Choose your program</h2>
    <p class="hint">Pick the program you are studying. The planner then follows that program's courses and rules. Your progress is saved separately for each program, so you can switch back and forth without losing anything.</p>
    <div id="programs" class="program-grid"></div>
  </main>

  <script src="programs/bp162vi23.js"></script>
  <script src="programs/bp162opvi.js"></script>
  <script src="programs/bh120.js"></script>
  <script src="programs/bh120vri23.js"></script>
  <script src="programs.js"></script>
</body>
</html>
