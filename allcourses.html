<!DOCTYPE html>
<html lang="en">
<head>

  <title>All Courses</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <h1>All Courses</h1>
      <p>Every course used by any program, listed once</p>
    </div>
    <nav><a href="index.html">My progress</a><a href="courses.html">Course list</a><a href="sequence.html">Course sequence</a><a href="allcourses.html" class="current">All courses</a><a href="programs.html">Change program</a></nav>
  </header>

  <main class="wide">
    <section aria-label="All courses">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search code or name">

        <select id="role" aria-label="Filter by role"></select>
        <select id="offered" aria-label="Filter by offering"></select>
      </div>
      <p id="count" class="hint"></p>
      <div class="table-wrap"><table id="table"></table></div>
    </section>
  </main>

  <script src="programs/bp162vi23.js"></script>
